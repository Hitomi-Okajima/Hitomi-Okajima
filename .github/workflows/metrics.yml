name: Metrics

# プロフィールの README に表示する統計画像（metrics.svg）を作る。
# private リポジトリの活動も数えるため、Secret の METRICS_TOKEN（classic PAT: repo・read:user）を使う。
# リポジトリ名やコミットの内容が出るプラグイン（activity・repositories など）は使わない。
on:
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00（日本時間）
  workflow_dispatch:

permissions:
  contents: write # metrics.svg をコミットするため

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          config_timezone: Asia/Tokyo
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
